[package]
name = "erst-ffi"
description = "UniFFI facade that exposes the Erst engine to Swift."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
erst-core = { path = "../erst-core" }
erst-store = { path = "../erst-store" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "=0.32.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
dbg_macro = "deny"
